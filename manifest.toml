packaging_format = 2

id = "lemmy"
name = "Lemmy"
description.en = "Link aggregator/Reddit clone for the fediverse"
description.fr = "Agrégateur de liens/clone Reddit pour le fedivers"

version = "0.19.20~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
website = "https://join-lemmy.org/"
demo = "https://lemmy.ml/"
admindoc = "https://join-lemmy.org/docs/en/"
code = "https://github.com/LemmyNet/lemmy"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "825M"
ram.build = "262M"
ram.runtime = "197M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.instance_name]
    ask.en = "Choose a name for your Lemmy instance"
    ask.fr = "Choisissez un nom pour votre instance Lemmy"
    type = "string"
    example = "My lemmy"
    default = "My lemmy"

[resources]
    [resources.sources]

    [resources.sources.lemmy]
    format = "docker"
    extract = true
    prefetch = false
    amd64.url = "dessalines/lemmy:0.19.20"
    amd64.sha256 = "255402f5c12aa59fa6b70a99e148618880c4a7c99f19de1e7ac7ff62edebc718"
    arm64.url = "dessalines/lemmy:0.19.20"
    arm64.sha256 = "829937d9d4a4755f1f13922bb3380e2cdc40d03a44a2de9d4d74162543f9d99f"

    [resources.sources.lemmy-ui]
    format = "docker"
    extract = true
    prefetch = false
    amd64.url = "dessalines/lemmy-ui:0.19.20"
    amd64.sha256 = "e5e67f73ad589f24712a2eb56ef9ce2854cc7c770bd28af59804335283257592"
    arm64.url = "dessalines/lemmy-ui:0.19.20"
    arm64.sha256 = "0c93fda584bc97c96b10fb3646fb1793dad49f46d0fa68a722be13ef87a9972c"

    [resources.sources.pict-rs]
    format = "docker"
    extract = true
    prefetch = false
    amd64.url = "asonix/pictrs:0.5.24"
    amd64.sha256 = "ccaf207cb6bc859893db0b51738a17f955e14569de64b50c41d3cd66f171a90a"
    arm64.url = "asonix/pictrs:0.5.24"
    arm64.sha256 = "6ed41534b903fedb7e48824b85358e5abbaa3b756a621987d0bfd34355b2f7bd"

    [resources.sources.lemmy-translations]
    url = "https://github.com/LemmyNet/lemmy-translations/archive/f03dfd1a4e73015b564ed230577d2fd8b23974f5.tar.gz"
    sha256 = "12336541b76112384019f51b53baafef65c21aff555ab18cc6928e88a36fb3b0"
    autoupdate.upstream = "https://github.com/LemmyNet/lemmy-translations/"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["pictrs-data", "sled", "exports", "magick"]

    [resources.permissions]
    main.url = "/"

    pictrs.url = "/pictrs"
    pictrs.allowed = "visitors"
    pictrs.show_tile = false
    pictrs.protected = true
    
    api.url = "/api"
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    api.protected = true

    inbox.url = "/inbox"
    inbox.allowed = "visitors"
    inbox.auth_header = false
    inbox.show_tile = false
    inbox.protected = true

    [resources.ports]
    main.default = 8536
    pictrs.default = 8080
    ui.default = 1235

    [resources.apt]
    packages = "postgresql, espeak, rsync, libfuse2, libimage-exiftool-perl, ffmpeg"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "20"
